<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1020"><title>Vexa</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f6f5ff;background:#0e1020}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;color:white;background:#7956e9;border-radius:14px;padding:12px 16px}button:disabled{opacity:.5}input{width:100%;padding:13px;background:#20243a;color:white;border:1px solid #41415d;border-radius:13px;outline:0}input:focus{border-color:#9a7aff}.app{max-width:950px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.brand{font-size:27px;font-weight:800;letter-spacing:-1px}.brand span{color:#a891ff}header{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a2c43}.muted{color:#a4a6c3;font-size:13px}.auth{max-width:410px;width:calc(100% - 32px);margin:12vh auto;padding:25px;border-radius:24px;background:#171a2e;box-shadow:0 12px 55px #0003}.auth h1{margin:10px 0 6px}.stack{display:grid;gap:12px;margin-top:20px}.link{background:transparent;color:#c8baff;padding:10px}.layout{display:grid;grid-template-columns:310px 1fr;flex:1;min-height:0}.side{border-right:1px solid #303249;padding:18px;overflow:auto}.side h2{font-size:18px}.user{display:flex;align-items:center;gap:12px;padding:12px;border-radius:15px;cursor:pointer}.user:hover,.user.active{background:#292b46}.avatar{display:grid;place-items:center;width:43px;height:43px;border-radius:16px;background:linear-gradient(135deg,#7c52e6,#c069c8);font-weight:800;flex-shrink:0}.chat{display:flex;flex-direction:column;min-height:0}.chat-head{padding:17px;border-bottom:1px solid #303249;font-weight:700}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:calc(100dvh - 210px)}.bubble{max-width:80%;padding:11px 14px;border-radius:17px;background:#272a43;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:#6747c6}.bubble small{display:block;opacity:.7;text-align:right;margin-top:5px;font-size:10px}.compose{display:flex;gap:10px;padding:15px;border-top:1px solid #303249}.compose input{flex:1}.empty{margin:auto;text-align:center;color:#a4a6c3;padding:25px}.notice{color:#f8b7b7;font-size:13px;min-height:20px}.hide{display:none!important}@media(max-width:650px){.layout{display:block}.side{border:0}.chat{height:calc(100dvh - 76px)}.messages{max-height:none}.mobile-hide{display:none!important}.back{display:inline-block!important}}.back{display:none;background:transparent;padding:4px 12px 4px 0}
</style></head><body><div class="app"><section id="auth" class="auth"><div class="brand">V<span>exa.</span></div><h1>Bağlantı burada başlar.</h1><div class="muted">Hesabına giriş yap veya aramıza katıl.</div><form id="authForm" class="stack"><input id="email" type="email" placeholder="E-posta" required autocomplete="email"><input id="password" type="password" placeholder="Şifre (en az 6 karakter)" minlength="6" required><input id="username" placeholder="Kullanıcı adı (3–20 karakter)" pattern="[a-z0-9_]{3,20}" class="hide"><button id="authSubmit">Giriş yap</button></form><button class="link" id="toggleAuth" type="button">Hesabın yok mu? Kayıt ol</button><button class="link" id="forgotPassword" type="button">Şifremi unuttum</button><button class="link hide" id="backToLogin" type="button">← Giriş ekranına dön</button><p id="authError" class="notice"></p></section><section id="main" class="hide" style="flex:1;display:flex;flex-direction:column"><header><div class="brand">V<span>exa.</span></div><div><span id="me" class="muted"></span> <button id="logout" class="link">Çıkış</button></div></header><div class="layout"><aside id="side" class="side"><h2>Sohbetler</h2><input id="search" placeholder="Kullanıcı adı ara..."><div id="users"></div></aside><section id="chat" class="chat mobile-hide"><div id="chatHead" class="chat-head"><button id="back" class="back">←</button><span id="chatTitle">Bir sohbet seç</span></div><div id="messages" class="messages"><div class="empty">Yeni bir sohbete başla ✨</div></div><form id="compose" class="compose"><input id="messageInput" placeholder="Mesaj yaz..." maxlength="2000" disabled><button id="send" disabled>Gönder</button></form></section></div></section></div>
<script>

// SUPABASE PROJECT URL ve PUBLISHABLE/ANON KEY gir. SERVICE ROLE KEY ASLA kullanma.
const SUPABASE_URL='https://crzuvunoaudedqtdmmbs.supabase.co', KEY='sb_publishable_9vSoBw8_xxpx2o6ajKwWBw_fIH_gywn';
const $=id=>document.getElementById(id);let supabase=null;let session=null,selected=null,channel=null,register=false,resetMode=false;
function error(id,msg){$(id).textContent=msg||''}function cleanName(s){return s.trim().toLowerCase()}function showAuth(){ $('auth').classList.remove('hide');$('main').classList.add('hide') }function showMain(){ $('auth').classList.add('hide');$('main').classList.remove('hide') }
function setAuthMode(mode){resetMode=mode==='reset';register=mode==='register';$('username').classList.toggle('hide',!register);$('username').required=register;$('password').classList.toggle('hide',resetMode);$('password').required=!resetMode;$('authSubmit').textContent=resetMode?'Şifre sıfırlama bağlantısı gönder':register?'Kayıt ol':'Giriş yap';$('toggleAuth').classList.toggle('hide',resetMode);$('forgotPassword').classList.toggle('hide',resetMode||register);$('backToLogin').classList.toggle('hide',!resetMode);$('toggleAuth').textContent=register?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol';error('authError','');}
$('toggleAuth').onclick=()=>setAuthMode(register?'login':'register');
$('forgotPassword').onclick=()=>setAuthMode('reset');
$('backToLogin').onclick=()=>setAuthMode('login');
$('authForm').onsubmit=async e=>{e.preventDefault();error('authError','İşlem yapılıyor...');if(!supabase)return error('authError','Supabase henüz bağlanmadı. Bağlantı hatası varsa internetini kontrol et.');try{const email=$('email').value.trim(),password=$('password').value;let result;if(resetMode){const {error:resetError}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.protocol==='file:'?undefined:location.origin+location.pathname});if(resetError)return error('authError','Şifre sıfırlama hatası: '+resetError.message);return error('authError','E-posta adresin kayıtlıysa şifre sıfırlama bağlantısı gönderildi. Gelen kutunu ve spam klasörünü kontrol et.')}if(register){const username=cleanName($('username').value);if(!/^[a-z0-9_]{3,20}$/.test(username))return error('authError','Kullanıcı adı 3-20 küçük harf, rakam veya _ içermeli.');result=await supabase.auth.signUp({email,password,options:{data:{username}}});if(result.error)return error('authError',result.error.message);if(!result.data.session)return error('authError','E-posta doğrulama bağlantısını aç, ardından giriş yap.');const created=await ensureProfile(result.data.user,username);if(!created)return;await init();}else{result=await supabase.auth.signInWithPassword({email,password});if(result.error)return error('authError',result.error.message);await init()}}catch(err){error('authError','Kayıt/giriş hatası: '+(err?.message||String(err)))}finally{if($('authError').textContent==='İşlem yapılıyor...')error('authError','')}};
async function ensureProfile(user,username){const {data}=await supabase.from('profiles').select('id').eq('id',user.id).maybeSingle();if(data)return true;const name=username||cleanName(user.user_metadata?.username||'');if(!/^[a-z0-9_]{3,20}$/.test(name)){error('authError','Kayıt için geçerli kullanıcı adı gerekli.');return false}const {error:err}=await supabase.from('profiles').insert({id:user.id,username:name});if(err){error('authError','Profil oluşturulamadı: '+err.message);return false}return true}
async function init(){const {data:{session:s}}=await supabase.auth.getSession();session=s;if(!session){showAuth();return}const ok=await ensureProfile(session.user);if(!ok){showAuth();return}showMain();const {data:profile}=await supabase.from('profiles').select('username').eq('id',session.user.id).single();$('me').textContent='@'+(profile?.username||'');await loadUsers()}
async function loadUsers(){const term=cleanName($('search').value);let q=supabase.from('profiles').select('id,username').neq('id',session.user.id).order('username').limit(40);if(term)q=q.ilike('username',`%${term.replace(/[%_,]/g,'')}%`);const {data,error:err}=await q;const box=$('users');box.replaceChildren();if(err){box.textContent=err.message;return}if(!data?.length){box.innerHTML='<p class="muted">Kullanıcı bulunamadı.</p>';return}data.forEach(u=>{const div=document.createElement('div');div.className='user'+(selected?.id===u.id?' active':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=u.username[0].toUpperCase();const name=document.createElement('span');name.textContent='@'+u.username;div.append(avatar,name);div.onclick=()=>openChat(u);box.append(div)})}
$('search').oninput=()=>loadUsers();async function openChat(u){selected=u;$('chatTitle').textContent='@'+u.username;$('messageInput').disabled=false;$('send').disabled=false;$('side').classList.add('mobile-hide');$('chat').classList.remove('mobile-hide');await loadMessages();await subscribe();loadUsers()}
$('back').onclick=()=>{$('chat').classList.add('mobile-hide');$('side').classList.remove('mobile-hide')};async function loadMessages(){if(!selected)return;const other=selected.id,me=session.user.id;const {data,error:err}=await supabase.from('messages').select('id,sender_id,body,created_at').or(`and(sender_id.eq.${me},recipient_id.eq.${other}),and(sender_id.eq.${other},recipient_id.eq.${me})`).order('created_at',{ascending:true}).limit(200);const box=$('messages');box.replaceChildren();if(err){box.textContent=err.message;return}for(const m of data||[]){const b=document.createElement('div');b.className='bubble'+(m.sender_id===me?' mine':'');b.textContent=m.body;const t=document.createElement('small');t.textContent=new Date(m.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});b.append(t);box.append(b)}box.scrollTop=box.scrollHeight}
async function subscribe(){if(channel)await supabase.removeChannel(channel);channel=supabase.channel('messages-'+session.user.id+'-'+selected.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{if(!selected)return;const m=payload.new;if((m.sender_id===session.user.id&&m.recipient_id===selected.id)||(m.recipient_id===session.user.id&&m.sender_id===selected.id))loadMessages()}).subscribe()}
$('compose').onsubmit=async e=>{e.preventDefault();const body=$('messageInput').value.trim();if(!body||!selected||!session)return;const to=selected.id;$('send').disabled=true;const {error:err}=await supabase.from('messages').insert({sender_id:session.user.id,recipient_id:to,body});$('send').disabled=false;if(err){alert('Mesaj gönderilemedi: '+err.message);return}$('messageInput').value='';await loadMessages()};$('logout').onclick=async()=>{if(channel)await supabase.removeChannel(channel);selected=null;await supabase.auth.signOut();session=null;showAuth()};
async function loadSdk(){
 const sources=['https://esm.sh/@supabase/supabase-js@2?bundle','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'];
 const failures=[];
 for(const src of sources){
  try{
   const mod=await import(src);
   if(typeof mod.createClient!=='function')throw new Error('createClient bulunamadı');
   return mod.createClient(SUPABASE_URL,KEY);
  }catch(e){failures.push(src+': '+(e?.message||String(e)));console.error('Supabase SDK:',src,e)}
 }
 throw new Error('Supabase SDK başlatılamadı: '+failures.join(' | '));
}
async function loadSupabase(){
 error('authError','Bağlantı hazırlanıyor...');
 try{supabase=await loadSdk()}
 catch(e){error('authError','Supabase yüklenemedi: '+e.message);console.error('Vexa SDK yükleme hatası:',e);return}
 try{await init();if($('authError').textContent==='Bağlantı hazırlanıyor...')error('authError','')}catch(e){error('authError','Supabase bağlantı hatası: '+e.message)}
 supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){
  showAuth();setAuthMode('reset');$('password').classList.remove('hide');$('password').required=true;
  $('authSubmit').textContent='Yeni şifreyi kaydet';
  $('authForm').onsubmit=async e=>{e.preventDefault();const pw=$('password').value;if(pw.length<6)return error('authError','Şifre en az 6 karakter olmalı.');const {error:err}=await supabase.auth.updateUser({password:pw});if(err)return error('authError',err.message);error('authError','Şifren güncellendi. Giriş ekranına dönmek için sayfayı yenile.')}
 }});
}
loadSupabase();
</script></body></html>
