<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1020"><title>Vexa</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f6f5ff;background:#0e1020}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;color:white;background:#7956e9;border-radius:14px;padding:12px 16px}button:disabled{opacity:.5}input{width:100%;padding:13px;background:#20243a;color:white;border:1px solid #41415d;border-radius:13px;outline:0}input:focus{border-color:#9a7aff}.app{max-width:950px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.brand{font-size:27px;font-weight:800;letter-spacing:-1px}.brand span{color:#a891ff}header{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a2c43}.muted{color:#a4a6c3;font-size:13px}.auth{max-width:410px;width:calc(100% - 32px);margin:12vh auto;padding:25px;border-radius:24px;background:#171a2e;box-shadow:0 12px 55px #0003}.auth h1{margin:10px 0 6px}.stack{display:grid;gap:12px;margin-top:20px}.link{background:transparent;color:#c8baff;padding:10px}.layout{display:grid;grid-template-columns:310px 1fr;flex:1;min-height:0}.side{border-right:1px solid #303249;padding:18px;overflow:auto}.side h2{font-size:18px}.user{display:flex;align-items:center;gap:12px;padding:12px;border-radius:15px;cursor:pointer}.user:hover,.user.active{background:#292b46}.avatar{display:grid;place-items:center;width:43px;height:43px;border-radius:16px;background:linear-gradient(135deg,#7c52e6,#c069c8);font-weight:800;flex-shrink:0}.chat{display:flex;flex-direction:column;min-height:0}.chat-head{padding:17px;border-bottom:1px solid #303249;font-weight:700}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:calc(100dvh - 210px)}.bubble{max-width:80%;padding:11px 14px;border-radius:17px;background:#272a43;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:#6747c6}.bubble small{display:block;opacity:.7;text-align:right;margin-top:5px;font-size:10px}.compose{display:flex;gap:10px;padding:15px;border-top:1px solid #303249}.compose input{flex:1}.empty{margin:auto;text-align:center;color:#a4a6c3;padding:25px}.notice{color:#f8b7b7;font-size:13px;min-height:20px}.hide{display:none!important}@media(max-width:650px){.layout{display:block}.side{border:0}.chat{height:calc(100dvh - 76px)}.messages{max-height:none}.mobile-hide{display:none!important}.back{display:inline-block!important}}.back{display:none;background:transparent;padding:4px 12px 4px 0}

.panel{background:#171a2e;border:1px solid #303249;border-radius:18px;padding:15px;margin-bottom:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{padding:9px 11px;background:#292b46}.tabs button.on{background:#7956e9}.profile-preview{display:flex;align-items:center;gap:12px;margin:10px 0}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}.avatar{overflow:hidden}.request{padding:11px 0;border-bottom:1px solid #34364e}.request button{margin:4px;padding:8px}.user button{margin-left:auto;padding:8px;font-size:12px}.side{max-height:calc(100dvh - 76px)}.side .panel{margin-top:12px}.chat-media{display:block;max-width:min(280px,65vw);max-height:290px;border-radius:12px;margin:6px 0}.bubble video{max-width:min(280px,65vw)}.compose{align-items:center}.compose input[type=file]{display:none}.attach{background:#343657;padding:12px;border-radius:12px;cursor:pointer}.status{font-size:12px;color:#c8baff;padding:5px 14px}.profile input{margin:7px 0}.profile textarea{width:100%;background:#20243a;border:1px solid #41415d;color:#fff;border-radius:12px;padding:12px;min-height:75px}.empty-list{color:#a4a6c3;font-size:13px;padding:12px}.tiny{font-size:11px;color:#b8b9d4}.user{min-width:0}.user .user-text{min-width:0;overflow-wrap:anywhere;flex:1}.chat-head{display:flex;align-items:center;gap:10px}.chat-head .avatar{width:32px;height:32px;border-radius:12px}
</style></head><body><div class="app"><section id="auth" class="auth"><div class="brand">V<span>exa.</span></div><h1>Bağlantı burada başlar.</h1><div class="muted">Hesabına giriş yap veya aramıza katıl.</div><form id="authForm" class="stack"><input id="email" type="email" placeholder="E-posta" required autocomplete="email"><input id="password" type="password" placeholder="Şifre (en az 6 karakter)" minlength="6" required><input id="username" placeholder="Kullanıcı adı (3–20 karakter)" pattern="[a-z0-9_]{3,20}" class="hide"><button id="authSubmit">Giriş yap</button></form><button class="link" id="toggleAuth" type="button">Hesabın yok mu? Kayıt ol</button><button class="link" id="forgotPassword" type="button">Şifremi unuttum</button><button class="link hide" id="backToLogin" type="button">← Giriş ekranına dön</button><p id="authError" class="notice"></p></section><section id="main" class="hide" style="flex:1;display:flex;flex-direction:column"><header><div class="brand">V<span>exa.</span></div><div><span id="me" class="muted"></span> <button id="logout" class="link">Çıkış</button></div></header><div class="layout"><aside id="side" class="side"><div class="tabs"><button id="tabChats" class="on" type="button">Sohbetler</button><button id="tabFind" type="button">Kişi ara</button><button id="tabRequests" type="button">İstekler <span id="requestCount"></span></button><button id="tabProfile" type="button">Profilim</button></div><div id="viewChats"><h2>Arkadaşlarım</h2><div id="friends"></div></div><div id="viewFind" class="hide"><input id="search" placeholder="Kullanıcı adı ara..."><div id="users"></div></div><div id="viewRequests" class="hide"><h2>Gelen istekler</h2><div id="incoming"></div><h2>Gönderilen istekler</h2><div id="outgoing"></div></div><div id="viewProfile" class="hide profile"><div class="panel"><h2>Profil düzenle</h2><div class="profile-preview"><div id="myAvatar" class="avatar">V</div><span id="profileUsername"></span></div><label>Profil fotoğrafı (en fazla 5 MB)</label><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp"><label>Görünen ad</label><input id="displayName" maxlength="40" placeholder="Görünen ad"><label>Biyografi</label><textarea id="bio" maxlength="160" placeholder="Hakkında..."></textarea><button id="saveProfile" type="button">Profili kaydet</button><p id="profileStatus" class="status"></p></div></div></aside><section id="chat" class="chat mobile-hide"><div id="chatHead" class="chat-head"><button id="back" class="back">←</button><div id="chatAvatar" class="avatar hide"></div><span id="chatTitle">Bir sohbet seç</span></div><div id="messages" class="messages"><div class="empty">Arkadaşını seçerek sohbete başla ✨</div></div><p id="uploadStatus" class="status"></p><form id="compose" class="compose"><label class="attach" title="Fotoğraf veya video ekle">📎<input id="mediaFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" disabled></label><input id="messageInput" placeholder="Mesaj yaz..." maxlength="2000" disabled><button id="send" disabled>Gönder</button></form></section></div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2?bundle';
const SUPABASE_URL='https://crzuvunoaudedqtdmmbs.supabase.co';
const KEY='sb_publishable_9vSoBw8_xxpx2o6ajKwWBw_fIH_gywn';
const db=createClient(SUPABASE_URL,KEY);
const $=id=>document.getElementById(id);
let session=null,me=null,selected=null,channel=null,register=false,resetMode=false,friendRows=[],profileRows=[],currentTab='Chats';
const err=(id,t)=>$(id).textContent=t||'';
const name=s=>s.trim().toLowerCase();
const avatarUrl=p=>p?.avatar_path?db.storage.from('vexa-avatars').getPublicUrl(p.avatar_path).data.publicUrl:null;
function avatar(p){const d=document.createElement('div');d.className='avatar';const url=avatarUrl(p);if(url){const i=document.createElement('img');i.src=url;i.alt='Profil fotoğrafı';d.append(i)}else d.textContent=(p?.display_name||p?.username||'?')[0].toUpperCase();return d}
function showAuth(){ $('auth').classList.remove('hide');$('main').classList.add('hide') }
function showMain(){ $('auth').classList.add('hide');$('main').classList.remove('hide') }
function setAuthMode(mode){resetMode=mode==='reset';register=mode==='register';$('username').classList.toggle('hide',!register);$('username').required=register;$('password').classList.toggle('hide',resetMode);$('password').required=!resetMode;$('authSubmit').textContent=resetMode?'Şifre sıfırlama bağlantısı gönder':register?'Kayıt ol':'Giriş yap';$('toggleAuth').classList.toggle('hide',resetMode);$('forgotPassword').classList.toggle('hide',resetMode||register);$('backToLogin').classList.toggle('hide',!resetMode);$('toggleAuth').textContent=register?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol';err('authError','')}
$('toggleAuth').onclick=()=>setAuthMode(register?'login':'register');$('forgotPassword').onclick=()=>setAuthMode('reset');$('backToLogin').onclick=()=>setAuthMode('login');
$('authForm').onsubmit=async e=>{e.preventDefault();try{const email=$('email').value.trim(),password=$('password').value;if(resetMode){const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;return err('authError','E-posta kayıtlıysa sıfırlama bağlantısı gönderildi.')}if(register){const username=name($('username').value);if(!/^[a-z0-9_]{3,20}$/.test(username))throw Error('Kullanıcı adı 3-20 küçük harf, sayı veya _ olmalı.');const {data,error}=await db.auth.signUp({email,password,options:{data:{username}}});if(error)throw error;if(!data.session)return err('authError','E-posta doğrulama bağlantısını aç, ardından giriş yap.')}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error}await init()}catch(e){err('authError',e.message)}};
async function ensureProfile(user){let {data,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;if(!data){const username=name(user.user_metadata?.username||'');if(!/^[a-z0-9_]{3,20}$/.test(username))throw Error('Profil oluşturmak için geçerli kullanıcı adı gerekli.');const result=await db.from('profiles').insert({id:user.id,username}).select().single();if(result.error)throw result.error;data=result.data}return data}
async function init(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!session){showAuth();return}try{me=await ensureProfile(session.user);$('me').textContent='@'+me.username;$('displayName').value=me.display_name||'';$('bio').value=me.bio||'';$('profileUsername').textContent='@'+me.username;$('myAvatar').replaceWith(Object.assign(avatar(me),{id:'myAvatar'}));showMain();await refresh();}catch(e){showAuth();err('authError',e.message)}}
function tab(t){currentTab=t;for(const v of ['Chats','Find','Requests','Profile']){$('view'+v).classList.toggle('hide',v!==t);$('tab'+v).classList.toggle('on',v===t)}}
for(const t of ['Chats','Find','Requests','Profile'])$('tab'+t).onclick=()=>{tab(t);if(t==='Find')searchUsers()};
const friendship=f=>f.status==='accepted';const otherId=f=>f.sender_id===session.user.id?f.recipient_id:f.sender_id;
const getProfile=id=>profileRows.find(p=>p.id===id);
function makeUser(p,action,caption){const row=document.createElement('div');row.className='user';row.append(avatar(p));const text=document.createElement('div');text.className='user-text';const title=document.createElement('strong');title.textContent=p.display_name||p.username;const small=document.createElement('div');small.className='tiny';small.textContent='@'+p.username+(caption?' · '+caption:'');text.append(title,small);row.append(text);if(action){const btn=document.createElement('button');btn.type='button';btn.textContent=action.label;btn.disabled=!!action.disabled;btn.onclick=async e=>{e.stopPropagation();try{await action.run();await refresh()}catch(ex){alert(ex.message)}};row.append(btn)}return row}
async function refresh(){if(!session)return;const [f,p]=await Promise.all([db.from('friend_requests').select('*').or(`sender_id.eq.${session.user.id},recipient_id.eq.${session.user.id}`),db.from('profiles').select('id,username,display_name,bio,avatar_path').limit(500)]);if(f.error)throw f.error;if(p.error)throw p.error;friendRows=f.data||[];profileRows=p.data||[];renderFriends();renderRequests();if(currentTab==='Find')searchUsers()}
function renderFriends(){const box=$('friends');box.replaceChildren();const friends=friendRows.filter(friendship);if(!friends.length){box.innerHTML='<div class="empty-list">Henüz arkadaşın yok. Kişi ara bölümünden istek gönder.</div>';return}friends.forEach(f=>{const p=getProfile(otherId(f));if(!p)return;const row=makeUser(p,{label:'Sohbet',run:()=>openChat(p)});row.onclick=()=>openChat(p);box.append(row)})}
function renderRequests(){const incoming=$('incoming'),outgoing=$('outgoing');incoming.replaceChildren();outgoing.replaceChildren();const inc=friendRows.filter(f=>f.recipient_id===session.user.id&&f.status==='pending');const out=friendRows.filter(f=>f.sender_id===session.user.id&&f.status==='pending');$('requestCount').textContent=inc.length?'('+inc.length+')':'';if(!inc.length)incoming.innerHTML='<div class="empty-list">Gelen istek yok.</div>';if(!out.length)outgoing.innerHTML='<div class="empty-list">Bekleyen istek yok.</div>';for(const f of inc){const p=getProfile(f.sender_id);if(!p)continue;const r=makeUser(p,{label:'Kabul et',run:async()=>{const {error}=await db.rpc('vexa_respond_friend_request',{p_id:f.id,p_accept:true});if(error)throw error}});const reject=document.createElement('button');reject.textContent='Reddet';reject.onclick=async()=>{const {error}=await db.rpc('vexa_respond_friend_request',{p_id:f.id,p_accept:false});if(error)alert(error.message);else refresh()};r.append(reject);incoming.append(r)}for(const f of out){const p=getProfile(f.recipient_id);if(p)outgoing.append(makeUser(p,{label:'İptal et',run:async()=>{const {error}=await db.from('friend_requests').delete().eq('id',f.id);if(error)throw error}},'İstek bekliyor'))}}
let searchTimer; $('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchUsers,250)};
async function searchUsers(){const q=name($('search').value);const box=$('users');box.replaceChildren();if(q.length<2){box.innerHTML='<div class="empty-list">En az 2 karakter yaz.</div>';return}const {data,error}=await db.from('profiles').select('id,username,display_name,avatar_path').ilike('username','%'+q.replace(/[%_,]/g,'')+'%').neq('id',session.user.id).limit(30);if(error){box.textContent=error.message;return}if(!data.length)box.innerHTML='<div class="empty-list">Kullanıcı bulunamadı.</div>';for(const p of data){const f=friendRows.find(f=>otherId(f)===p.id);let action;if(f?.status==='accepted')action={label:'Sohbet',run:()=>openChat(p)};else if(f?.status==='pending'&&f.sender_id===session.user.id)action={label:'Bekliyor',disabled:true,run:()=>{}};else if(f?.status==='pending')action={label:'İsteklerde',run:()=>tab('Requests')};else action={label:'Arkadaş ekle',run:async()=>{if(f){const {error}=await db.from('friend_requests').delete().eq('id',f.id);if(error)throw error}const {error}=await db.from('friend_requests').insert({sender_id:session.user.id,recipient_id:p.id});if(error)throw error}};box.append(makeUser(p,action))}}
async function openChat(p){if(!friendRows.some(f=>friendship(f)&&otherId(f)===p.id)){alert('Önce arkadaşlık isteği kabul edilmeli.');return}selected=p;$('chatTitle').textContent=p.display_name||'@'+p.username;$('chatAvatar').replaceWith(Object.assign(avatar(p),{id:'chatAvatar'}));$('messageInput').disabled=false;$('mediaFile').disabled=false;$('send').disabled=false;$('side').classList.add('mobile-hide');$('chat').classList.remove('mobile-hide');await loadMessages();await subscribe()}
$('back').onclick=()=>{$('chat').classList.add('mobile-hide');$('side').classList.remove('mobile-hide')};
async function mediaLink(path){const {data,error}=await db.storage.from('vexa-media').createSignedUrl(path,3600);if(error)throw error;return data.signedUrl}
async function loadMessages(){if(!selected)return;const other=selected.id,meId=session.user.id;const {data,error}=await db.from('messages').select('id,sender_id,recipient_id,body,media_path,media_type,created_at').or(`and(sender_id.eq.${meId},recipient_id.eq.${other}),and(sender_id.eq.${other},recipient_id.eq.${meId})`).order('created_at',{ascending:true}).limit(200);const box=$('messages');box.replaceChildren();if(error){box.textContent=error.message;return}for(const m of data||[]){const b=document.createElement('div');b.className='bubble'+(m.sender_id===meId?' mine':'');if(m.body){const t=document.createElement('div');t.textContent=m.body;b.append(t)}if(m.media_path){try{const url=await mediaLink(m.media_path);const el=document.createElement(m.media_type==='video'?'video':'img');el.className='chat-media';el.src=url;if(m.media_type==='video')el.controls=true;else{el.alt='Gönderilen fotoğraf';el.style.cursor='pointer';el.onclick=()=>window.open(url,'_blank','noopener')}b.append(el)}catch(e){const t=document.createElement('small');t.textContent='Medya açılamadı: '+e.message;b.append(t)}}const t=document.createElement('small');t.textContent=new Date(m.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});b.append(t);box.append(b)}box.scrollTop=box.scrollHeight}
async function subscribe(){if(channel)await db.removeChannel(channel);channel=db.channel('vexa-'+session.user.id+'-'+selected.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{const m=payload.new;if(selected&&((m.sender_id===session.user.id&&m.recipient_id===selected.id)||(m.recipient_id===session.user.id&&m.sender_id===selected.id)))loadMessages()}).subscribe()}
$('compose').onsubmit=async e=>{e.preventDefault();if(!selected||!session)return;const body=$('messageInput').value.trim(),file=$('mediaFile').files[0];if(!body&&!file)return;$('send').disabled=true;let path=null,type=null;try{if(file){type=file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':null;const allowed=['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','video/quicktime'];if(!type||!allowed.includes(file.type))throw Error('Desteklenmeyen dosya türü.');if(file.size>25*1024*1024)throw Error('Dosya 25 MB sınırını aşıyor.');path=session.user.id+'/'+crypto.randomUUID()+'.'+(file.name.split('.').pop()||'bin').toLowerCase();err('uploadStatus','Medya yükleniyor...');const {error}=await db.storage.from('vexa-media').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error}const {error}=await db.from('messages').insert({sender_id:session.user.id,recipient_id:selected.id,body:body||null,media_path:path,media_type:type});if(error)throw error;$('messageInput').value='';$('mediaFile').value='';err('uploadStatus','');await loadMessages()}catch(e){err('uploadStatus','Hata: '+e.message)}finally{$('send').disabled=false}};
$('saveProfile').onclick=async()=>{const btn=$('saveProfile');btn.disabled=true;try{const patch={display_name:$('displayName').value.trim().slice(0,40),bio:$('bio').value.trim().slice(0,160)};const file=$('avatarFile').files[0];if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Profil fotoğrafı JPG/PNG/WebP ve en fazla 5 MB olmalı.');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=session.user.id+'/'+crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('vexa-avatars').upload(path,file,{contentType:file.type});if(error)throw error;patch.avatar_path=path}const {data,error}=await db.from('profiles').update(patch).eq('id',session.user.id).select().single();if(error)throw error;me=data;$('myAvatar').replaceWith(Object.assign(avatar(me),{id:'myAvatar'}));$('avatarFile').value='';err('profileStatus','Profil kaydedildi.');await refresh()}catch(e){err('profileStatus','Hata: '+e.message)}finally{btn.disabled=false}};
$('logout').onclick=async()=>{if(channel)await db.removeChannel(channel);selected=null;await db.auth.signOut();session=null;showAuth()};
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){showAuth();setAuthMode('reset');$('password').classList.remove('hide');$('password').required=true;$('authSubmit').textContent='Yeni şifreyi kaydet';$('authForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.updateUser({password:$('password').value});err('authError',error?error.message:'Şifren güncellendi. Sayfayı yenileyerek giriş yap.')}}});
init().catch(e=>err('authError',e.message));
</script></body></html>
