let session=null,me=null,selected=null,channel=null,globalChannel=null,register=false,resetMode=false,friendRows=[],profileRows=[],currentTab='Chats',replyTo=null,recorder=null,audioChunks=[],typingTimer=null,typingClear=null,online=false,roomToken=0;

function avatar(p){const d=document.createElement('div');d.className='avatar';const url=avatarUrl(p);if(url){const i=document.createElement('img');i.src=url;i.alt='Profil fotoğrafı';d.append(i)}else d.textContent=(p?.display_name||p?.username||'?')[0].toUpperCase();return d}
function showAuth(){ $('auth').classList.remove('hide');$('main').classList.add('hide') }

function setAuthMode(mode){resetMode=mode==='reset';register=mode==='register';$('username').classList.toggle('hide',!register);$('username').required=register;$('password').classList.toggle('hide',resetMode);$('password').required=!resetMode;$('authSubmit').textContent=resetMode?'Şifre sıfırlama bağlantısı gönder':register?'Kayıt ol':'Giriş yap';$('toggleAuth').classList.toggle('hide',resetMode);$('forgotPassword').classList.toggle('hide',resetMode||register);$('backToLogin').classList.toggle('hide',!resetMode);$('toggleAuth').textContent=register?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol';err('authError','')}

async function ensureProfile(user){let {data,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;if(!data){const username=name(user.user_metadata?.username||'');if(!/^[a-z0-9_]{3,20}$/.test(username))throw Error('Profil oluşturmak için geçerli kullanıcı adı gerekli.');const result=await db.from('profiles').insert({id:user.id,username}).select().single();if(result.error)throw result.error;data=result.data}return data}
async function init(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!session){showAuth();return}try{me=await ensureProfile(session.user);$('me').textContent='@'+me.username;$('displayName').value=me.display_name||'';$('bio').value=me.bio||'';$('profileUsername').textContent='@'+me.username;$('myAvatar').replaceWith(Object.assign(avatar(me),{id:'myAvatar'}));showMain();await refresh();await subscribeInbox();}catch(e){showAuth();err('authError',e.message)}}
function tab(t){currentTab=t;for(const v of ['Chats','Find','Requests','Profile']){$('view'+v).classList.toggle('hide',v!==t);$('tab'+v).classList.toggle('on',v===t)}}
for(const t of ['Chats','Find','Requests','Profile'])$('tab'+t).onclick=()=>{tab(t);if(t==='Find')searchUsers()};
const friendship=f=>f.status==='accepted';const otherId=f=>f.sender_id===session.user.id?f.recipient_id:f.sender_id;
const getProfile=id=>profileRows.find(p=>p.id===id);
function makeUser(p,action,caption){const row=document.createElement('div');row.className='user';row.append(avatar(p));const text=document.createElement('div');text.className='user-text';const title=document.createElement('strong');title.textContent=p.display_name||p.username;const small=document.createElement('div');small.className='tiny';small.textContent='@'+p.username+(caption?' · '+caption:'');text.append(title,small);row.append(text);if(action){const btn=document.createElement('button');btn.type='button';btn.textContent=action.label;btn.disabled=!!action.disabled;btn.onclick=async e=>{e.stopPropagation();try{await action.run();await refresh()}catch(ex){alert(ex.message?.includes('Arkadaşlık isteği zaten mevcut')?'Bu kişiye zaten istek gönderdin.':ex.message)}};row.append(btn)}return row}
async function refresh(){if(!session)return;const [f,p]=await Promise.all([db.from('friend_requests').select('*').or(`sender_id.eq.${session.user.id},recipient_id.eq.${session.user.id}`),db.from('profiles').select('id,username,display_name,bio,avatar_path').limit(500)]);if(f.error)throw f.error;if(p.error)throw p.error;friendRows=f.data||[];profileRows=p.data||[];renderFriends();renderRequests();if(currentTab==='Find')searchUsers()}
function renderFriends(){const box=$('friends');box.replaceChildren();const friends=friendRows.filter(friendship);if(!friends.length){box.innerHTML='<div class="empty-list">Henüz arkadaşın yok. Kişi ara bölümünden istek gönder.</div>';return}friends.forEach(f=>{const p=getProfile(otherId(f));if(!p)return;const row=makeUser(p,{label:'Sohbet',run:()=>openChat(p)});row.onclick=()=>openChat(p);box.append(row)})}
function renderRequests(){const incoming=$('incoming'),outgoing=$('outgoing');incoming.replaceChildren();outgoing.replaceChildren();const inc=friendRows.filter(f=>f.recipient_id===session.user.id&&f.status==='pending');const out=friendRows.filter(f=>f.sender_id===session.user.id&&f.status==='pending');$('requestCount').textContent=inc.length?'('+inc.length+')':'';if(!inc.length)incoming.innerHTML='<div class="empty-list">Gelen istek yok.</div>';if(!out.length)outgoing.innerHTML='<div class="empty-list">Bekleyen istek yok.</div>';for(const f of inc){const p=getProfile(f.sender_id);if(!p)continue;const r=makeUser(p,{label:'Kabul et',run:async()=>{const {error}=await db.rpc('vexa_respond_friend_request',{p_id:f.id,p_accept:true});if(error)throw error}});const reject=document.createElement('button');reject.textContent='Reddet';reject.onclick=async()=>{const {error}=await db.rpc('vexa_respond_friend_request',{p_id:f.id,p_accept:false});if(error)alert(error.message);else refresh()};r.append(reject);incoming.append(r)}for(const f of out){const p=getProfile(f.recipient_id);if(p)outgoing.append(makeUser(p,{label:'İptal et',run:async()=>{const {error}=await db.from('friend_requests').delete().eq('id',f.id);if(error)throw error}},'İstek bekliyor'))}}
let searchTimer; $('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchUsers,250)};
async function searchUsers(){const q=name($('search').value);const box=$('users');box.replaceChildren();if(q.length<2){box.innerHTML='<div class="empty-list">En az 2 karakter yaz.</div>';return}const {data,error}=await db.from('profiles').select('id,username,display_name,avatar_path').ilike('username','%'+q.replace(/[%_,]/g,'')+'%').neq('id',session.user.id).limit(30);if(error){box.textContent=error.message;return}if(!data.length)box.innerHTML='<div class="empty-list">Kullanıcı bulunamadı.</div>';for(const p of data){const f=friendRows.find(f=>otherId(f)===p.id);let action;if(f?.status==='accepted')action={label:'Sohbet',run:()=>openChat(p)};else if(f?.status==='pending'&&f.sender_id===session.user.id)action={label:'Bekliyor',disabled:true,run:()=>{}};else if(f?.status==='pending')action={label:'İsteklerde',run:()=>tab('Requests')};else action={label:'Arkadaş ekle',run:async()=>{const {error}=await db.rpc('vexa_send_friend_request',{p_recipient_id:p.id});if(error)throw error}};box.append(makeUser(p,action))}}

 if(!friendRows.some(f=>friendship(f)&&otherId(f)===p.id)){alert('Önce arkadaşlık isteği kabul edilmeli.');return}

 $('messageInput').disabled=false;$('mediaFile').disabled=false;$('recordBtn').disabled=false;$('send').disabled=false;$('side').classList.add('mobile-hide');$('chat').classList.remove('mobile-hide');await loadMessages();await subscribe();
}

async function mediaLink(path){const {data,error}=await db.storage.from('vexa-media').createSignedUrl(path,3600);if(error)throw error;return data.signedUrl}
async function loadMessages(){
 if(!selected||!session)return;const other=selected.id,meId=session.user.id,token=roomToken;
 const {data,error}=await db.from('messages').select('id,sender_id,recipient_id,body,media_path,media_type,created_at,read_at,reply_to,deleted_at').or(`and(sender_id.eq.${meId},recipient_id.eq.${other}),and(sender_id.eq.${other},recipient_id.eq.${meId})`).order('created_at',{ascending:true}).limit(200);
 if(token!==roomToken)return;const box=$('messages');box.replaceChildren();if(error){box.textContent=error.message;return}
 const byId=new Map((data||[]).map(m=>[m.id,m]));
 for(const m of data||[]){const b=document.createElement('div');b.className='bubble'+(m.sender_id===meId?' mine':'');
 if(m.reply_to){const original=byId.get(m.reply_to);const quote=document.createElement('div');quote.className='reply-quote';quote.textContent=original?(original.deleted_at?'Silinmiş mesaj':original.body||'📎 Medya'):'↩ Yanıtlanan mesaj';b.append(quote)}
 if(m.deleted_at){const d=document.createElement('i');d.textContent='Bu mesaj silindi';b.append(d)}else{
 if(m.body){const t=document.createElement('div');t.textContent=m.body;b.append(t)}
 if(m.media_path){try{const url=await mediaLink(m.media_path);if(token!==roomToken)return;let el;if(m.media_type==='audio'){el=document.createElement('audio');el.controls=true;el.className='voice-audio'}else{el=document.createElement(m.media_type==='video'?'video':'img');el.className='chat-media';if(m.media_type==='video')el.controls=true;else{el.alt='Gönderilen fotoğraf';el.style.cursor='pointer';el.onclick=()=>window.open(url,'_blank','noopener')}}el.src=url;b.append(el)}catch(e){const t=document.createElement('small');t.textContent='Medya açılamadı: '+e.message;b.append(t)}}}
 const time=document.createElement('small');time.textContent=new Date(m.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+(m.sender_id===meId?' · '+(m.read_at?'✓✓ Okundu':'✓ Gönderildi'):'');b.append(time);
 if(!m.deleted_at){const actions=document.createElement('div');actions.className='message-actions';const reply=document.createElement('button');reply.textContent='↩ Yanıtla';reply.type='button';reply.onclick=()=>replyMessage(m);actions.append(reply);if(m.sender_id===meId){const del=document.createElement('button');del.type='button';del.textContent='Sil';del.onclick=async()=>{if(!confirm('Bu mesaj iki taraftan silinsin mi?'))return;const {error}=await db.rpc('vexa_delete_message',{p_message_id:m.id});if(error)alert(error.message);else await loadMessages()};actions.append(del)}b.append(actions)}box.append(b)}
 box.scrollTop=box.scrollHeight;
 if(document.visibilityState==='visible'){const {error:readError}=await db.rpc('vexa_mark_read',{p_sender_id:other});if(readError)console.warn('Okundu bilgisi:',readError.message)}
}

async function subscribe(){
 if(!selected||!session)return;const other=selected.id;
 channel=db.channel(roomName(session.user.id,other),{config:{presence:{key:session.user.id},broadcast:{self:false}}})
 .on('presence',{event:'sync'},updatePresence)
 .on('broadcast',{event:'typing'},({payload})=>{if(payload?.user_id===other)showTyping()})
 .on('postgres_changes',{event:'*',schema:'public',table:'messages'},payload=>{const m=payload.new||payload.old;if(m&&((m.sender_id===session.user.id&&m.recipient_id===other)||(m.recipient_id===session.user.id&&m.sender_id===other)))loadMessages()})
 .subscribe(async status=>{if(status==='SUBSCRIBED'){await channel?.track({user_id:session.user.id,online_at:new Date().toISOString()});updatePresence()}});
}
async function subscribeInbox(){
 if(globalChannel)await db.removeChannel(globalChannel);
 if(!session)return;
 globalChannel=db.channel('vexa-inbox-'+session.user.id)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+session.user.id},async payload=>{
 const m=payload.new;if(!m||m.sender_id===selected?.id&&document.visibilityState==='visible')return;
 const p=getProfile(m.sender_id);const title=p?.display_name||p?.username||'Vexa';
 if('Notification' in window&&Notification.permission==='granted'&&document.visibilityState==='visible')new Notification('Vexa · '+title,{body:m.body||'📎 Yeni medya mesajı',tag:'vexa-'+m.sender_id});
 }).subscribe();
}
$('notifyBtn').onclick=async()=>{if(!('Notification' in window)){alert('Bu tarayıcı bildirimleri desteklemiyor.');return}if(!window.isSecureContext){alert('Bildirimler için HTTPS gerekir.');return}const p=await Notification.requestPermission();$('notifyBtn').textContent=p==='granted'?'🔔 Açık':'🔕 Kapalı';alert(p==='granted'?'Uygulama açıkken bildirim izni verildi. Arka plan bildirimi için ayrıca Web Push kurulmalıdır.':'Bildirim izni verilmedi.')};

async function sendMessage(body,file){
 if(!selected||!session)return;let path=null,type=null;
 if(file){type=file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':null;
 const allowed=['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','video/quicktime','audio/webm','audio/mp4','audio/ogg','audio/mpeg'];
 if(!type||!allowed.includes(file.type))throw Error('Desteklenmeyen dosya türü: '+file.type);
 if(file.size>25*1024*1024)throw Error('Dosya 25 MB sınırını aşıyor.');
 const ext=({'audio/webm':'webm','audio/mp4':'m4a','audio/ogg':'ogg','audio/mpeg':'mp3'})[file.type]||(file.name.split('.').pop()||'bin').toLowerCase();
 path=session.user.id+'/'+crypto.randomUUID()+'.'+ext;err('uploadStatus','Medya yükleniyor...');
 const {error}=await db.storage.from('vexa-media').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;
 }
 const {error}=await db.from('messages').insert({sender_id:session.user.id,recipient_id:selected.id,body:body||null,media_path:path,media_type:type,reply_to:replyTo?.id||null});if(error)throw error;
 clearReply();err('uploadStatus','');await loadMessages();
}
$('compose').onsubmit=async e=>{e.preventDefault();if(!selected||!session)return;const body=$('messageInput').value.trim(),file=$('mediaFile').files[0];if(!body&&!file)return;$('send').disabled=true;try{await sendMessage(body,file);$('messageInput').value='';$('mediaFile').value=''}catch(e){err('uploadStatus','Hata: '+e.message)}finally{$('send').disabled=false}};
$('recordBtn').onclick=async()=>{
 const btn=$('recordBtn');if(recorder&&recorder.state==='recording'){recorder.stop();return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('Bu cihazda ses kaydı desteklenmiyor. HTTPS kullan.');return}
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/webm','audio/mp4','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw Error('Desteklenen ses formatı bulunamadı');
 recorder=new MediaRecorder(stream,{mimeType:mime});audioChunks=[];recorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};
 recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());btn.textContent='🎤';btn.classList.remove('recording');const blob=new Blob(audioChunks,{type:mime});if(!blob.size)return;btn.disabled=true;try{await sendMessage('',new File([blob],'ses.'+(mime==='audio/mp4'?'m4a':mime==='audio/ogg'?'ogg':'webm'),{type:mime}))}catch(e){err('uploadStatus','Ses gönderilemedi: '+e.message)}finally{btn.disabled=false;recorder=null}};
 recorder.start();btn.textContent='⏹';btn.classList.add('recording');err('uploadStatus','Ses kaydediliyor. Bitirmek için ⏹ düğmesine bas.');
 }catch(e){alert('Mikrofon açılamadı: '+e.message);recorder=null}
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&selected)loadMessages()});

$('saveProfile').onclick=async()=>{const btn=$('saveProfile');btn.disabled=true;try{const patch={display_name:$('displayName').value.trim().slice(0,40),bio:$('bio').value.trim().slice(0,160)};const file=$('avatarFile').files[0];if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Profil fotoğrafı JPG/PNG/WebP ve en fazla 5 MB olmalı.');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=session.user.id+'/'+crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('vexa-avatars').upload(path,file,{contentType:file.type});if(error)throw error;patch.avatar_path=path}const {data,error}=await db.from('profiles').update(patch).eq('id',session.user.id).select().single();if(error)throw error;me=data;$('myAvatar').replaceWith(Object.assign(avatar(me),{id:'myAvatar'}));$('avatarFile').value='';err('profileStatus','Profil kaydedildi.');await refresh()}catch(e){err('profileStatus','Hata: '+e.message)}finally{btn.disabled=false}};
$('logout').onclick=async()=>{if(channel)await db.removeChannel(channel);if(globalChannel)await db.removeChannel(globalChannel);selected=null;await db.auth.signOut();session=null;showAuth()};
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){showAuth();setAuthMode('reset');$('password').classList.remove('hide');$('password').required=true;$('authSubmit').textContent='Yeni şifreyi kaydet';$('authForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.updateUser({password:$('password').value});err('authError',error?error.message:'Şifren güncellendi. Sayfayı yenileyerek giriş yap.')}}});
init().catch(e=>err('authError',e.message));
</script></body></html>
